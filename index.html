<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="icon" type="image/svg+xml" href="icons/plus.svg">
<link rel="preload" href="fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Instrument Sans (OFL), the Google Fonts files kept locally so a reload never paints
     a fallback font first. "block" is safe because the files load from disk. */
  @font-face {
    font-family: "Instrument Sans";
    font-weight: 400 700;
    font-display: block;
    src: url(fonts/instrument-sans-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: "Instrument Sans";
    font-weight: 400 700;
    font-display: block;
    src: url(fonts/instrument-sans-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  /* Tokens from Helium Prism (src/css/styles.css), https://github.com/imputnet/helium-prism */
  :root {
    --font: "Instrument Sans", system-ui, Helvetica, Arial, sans-serif;

    --primary: #0d1c64;
    --secondary: #475a7f;
    --tertiary: #646f9a;

    --helium-blue: #3450d1;

    --bg-surface: #fbfcff;
    --bg-gradient-start: #f4f7ff;
    --bg-gradient-end: #acbbff;
    --intro-gradient: linear-gradient(180deg, #e3e8ff 0%, #f4f7ff 100%);

    --tooltip-bg: #eaedfd;
    --tooltip-shadow: color-mix(in srgb, #9ba6d8 50%, transparent);

    --helium-elevated: #3450d1;
    --helium-elevated-7: color-mix(in srgb, var(--helium-elevated) 7%, transparent);
    --helium-elevated-9: color-mix(in srgb, var(--helium-elevated) 9%, transparent);
    --helium-elevated-10: color-mix(in srgb, var(--helium-elevated) 10%, transparent);
    --helium-elevated-15: color-mix(in srgb, var(--helium-elevated) 15%, transparent);
    --helium-elevated-30: color-mix(in srgb, var(--helium-elevated) 30%, transparent);

    --gap-1: 6px;
    --gap-3: 12px;
    --mid-border-radius: 12px;
    --card-border-radius: 20px;
    --glass-filter: blur(12px) saturate(110%);

    /* Not in Prism: the forecast panel surface and range bar */
    --panel: color-mix(in srgb, #fbfcff 78%, transparent);
    --bar-start: #8fa0ec;
    --bar-end: var(--helium-blue);
    /* Privacy report categories */
    --trackers: var(--helium-blue);
    --ads: #e8833a;
    --other: #9aa3c4;
    /* Browsing activity: how pages were reached */
    --typed: var(--helium-blue);
    --links: #8a6fd8;
    --bookmarks: #e8833a;

    /* GradientShimmer settings, from Prism's GradientShimmer.svelte */
    --shimmer-alpha: 0.35;
    --shimmer-grain-alpha: 0.15;
    --shimmer-grain-luminance: 220;
    --shimmer-grain-contrast: 34;
    --shimmer-grain-saturation: 8;
    --shimmer-intro-alpha: 0.6;
    --shimmer-speed-up-shine-boost: 0.3;

    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #e3e6f2;
      --secondary: #8f9bcb;
      --tertiary: #7985b2;

      --tooltip-bg: #1d2a5d;
      --tooltip-shadow: color-mix(in srgb, var(--tooltip-bg) 40%, transparent);

      --bg-surface: #0e1123;
      --bg-gradient-start: #151932;
      --bg-gradient-end: #2d3c7f;
      --intro-gradient: linear-gradient(180deg, #151932 0%, #2d3c7f 100%);

      --helium-elevated: #b3beec;
      --glass-filter: blur(12px);

      --panel: color-mix(in srgb, #0e1123 72%, transparent);
      --bar-start: #5a6cc4;
      --bar-end: var(--helium-elevated);
      --trackers: #7d92f5;
      --ads: #f0a066;
      --other: #5c6690;
      --typed: #7d92f5;
      --links: #b39cf5;
      --bookmarks: #f0a066;

      --shimmer-alpha: 0.7;
      --shimmer-grain-alpha: 0.15;
      --shimmer-grain-luminance: 144;
      --shimmer-grain-contrast: 64;
      --shimmer-grain-saturation: 32;
      --shimmer-intro-alpha: 1;
      --shimmer-speed-up-shine-boost: 0.15;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    overflow: hidden;
    background: var(--bg-surface);
    color: var(--primary);
    font-family: var(--font);
    font-weight: 500;
    line-height: 120%;
    letter-spacing: -0.01em;
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { color: var(--primary); background-color: var(--helium-elevated-30); }
  h1, h4, h5, h6 { margin: 0; font-weight: 500; line-height: 120%; }
  h1 { font-size: 43px; letter-spacing: -0.02em; line-height: 110%; }
  h4 { font-size: 17px; }
  h5 { font-size: 14px; }
  h6 { font-size: 12px; }
  p { margin: 0; font-size: 16px; line-height: 122%; color: var(--secondary); }
  strong { font-weight: 600; }
  svg { flex: none; pointer-events: none; }
  .muted { color: var(--tertiary); }

  /* GradientShimmer canvas */
  #shimmer {
    --shimmer-highlight: var(--bg-gradient-end);
    --shimmer-start: var(--bg-gradient-start);
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    opacity: 0;
    pointer-events: none;
    image-rendering: pixelated;
    transition: opacity 0.3s;
  }
  #shimmer.visible { opacity: 1; }
  #shimmer.fallback { background: var(--intro-gradient); }

  .app {
    position: relative;
    min-height: 100vh;
    padding: 6vh 5vw 140px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .time {
    font-size: clamp(96px, 19vh, 190px);
    font-weight: 450;
    letter-spacing: -0.04em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .date { margin-top: 14px; font-size: clamp(18px, 2.8vh, 24px); color: var(--secondary); }
  /* app.js fills these, and the browser can paint once before it runs. Reserving a
     line each keeps the search bar from jumping on reload. */
  .time, .date { min-height: 1lh; }
  .time .ampm { margin-left: 0.12em; font-size: 0.32em; letter-spacing: 0; color: var(--secondary); }

  /* Prism Input / SearchBar */
  .input-field {
    display: flex; align-items: center; gap: 9px;
    width: min(560px, 100%); min-height: 46px; margin-top: 36px;
    padding: 13px 16px;
    border-radius: var(--mid-border-radius);
    background: var(--helium-elevated-9);
    backdrop-filter: var(--glass-filter);
    color: var(--primary);
    cursor: text;
    transition: 0.2s background-color, 0.1s outline-color;
  }
  .input-field:hover { background: var(--helium-elevated-10); }
  .input-field:focus-within { background: var(--helium-elevated-10); outline: 2px solid var(--primary); outline-offset: -1px; }
  .input-field .accessory { display: inline-flex; min-width: 18px; min-height: 18px; color: var(--tertiary); }
  .input-field:focus-within .accessory { color: var(--primary); }
  .input-field input {
    flex: 1; min-width: 0; padding: 0;
    border: 0; outline: 0; background: none;
    color: inherit; font: inherit; font-size: 16px; line-height: 122%; letter-spacing: inherit;
  }
  .input-field input::placeholder { color: var(--tertiary); }
  .input-field input::-webkit-search-decoration,
  .input-field input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .bang-chip {
    padding: 3px 10px;
    /* The negative margin keeps the chip from adding to the field's height */
    margin-block: -3px;
    border-radius: 999px;
    background: var(--helium-elevated-15);
    color: var(--primary);
    font-size: 13px;
    white-space: nowrap;
  }
  .bang-chip:empty { display: none; }

  /* Suggestions under the search box: bangs, or pages from history and bookmarks */
  /* Above the corner pills and their panels only while it has suggestions to show */
  #search { position: relative; }
  #search:has(.suggest:not(:empty)) { z-index: 3; }
  .weather, .dock { z-index: 2; }
  .suggest {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px);
    margin: 0; padding: 4px;
    list-style: none; text-align: left;
    border-radius: var(--mid-border-radius);
    background: var(--bg-surface);
    outline: 1.5px solid var(--helium-elevated-10); outline-offset: -1.5px;
    box-shadow: 4px 8px 30px 0 var(--tooltip-shadow);
    cursor: default;
  }
  .suggest:empty { display: none; }
  .suggest li { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
  .suggest li.active { background: var(--helium-elevated-10); }
  .suggest .fav { display: inline-flex; flex: none; width: 16px; height: 16px; color: var(--tertiary); }
  .suggest .txt { display: flex; align-items: baseline; gap: 10px; flex: 1; min-width: 0; }
  .suggest .title, .suggest small { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .suggest .title { flex: 0 1 auto; max-width: 75%; font-size: 15px; color: var(--secondary); }
  .suggest .title b { font-weight: inherit; color: var(--primary); }
  .suggest small { flex: 1 1 0; min-width: 0; font-size: 13px; color: var(--tertiary); }
  .suggest .tag { flex: none; padding: 2px 9px; border-radius: 999px; background: var(--helium-elevated-15); font-size: 12px; }
  .suggest .mark { display: inline-flex; flex: none; color: var(--tertiary); }

  /* Prism Button, used for the weather pills */
  .button {
    display: inline-flex; align-items: center; gap: 7px;
    min-height: 38px; padding: 9px 16px 9px 14px;
    border: 0; border-radius: 19px;
    background: var(--helium-elevated-9);
    backdrop-filter: var(--glass-filter);
    color: var(--primary);
    font: inherit; font-size: 16px; letter-spacing: inherit;
    cursor: pointer;
    transition: 0.2s background-color, 0.2s transform;
  }
  .button:hover { background: var(--helium-elevated-10); }
  .button:active { background: var(--helium-elevated-15); transform: scale(0.97); }
  .button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
  .button[aria-expanded="true"] { box-shadow: 0 0 0 1px var(--primary) inset, 0 0 0 1px var(--primary); }

  /* Weather: a pill per city in the bottom corners, each opens a forecast panel */
  .weather {
    position: fixed; left: 5vw; right: 5vw; bottom: 4vh;
    display: flex; justify-content: space-between; align-items: flex-end;
    pointer-events: none;
  }
  .wx { position: relative; pointer-events: auto; }
  .wx.end { margin-left: auto; }
  .panel {
    position: absolute; left: 0; bottom: calc(100% + 12px);
    /* Within the window: 5vw each side, and above the pill (4vh + 38px + the 12px gap) */
    width: min(384px, 90vw);
    max-height: calc(96vh - 50px - 16px);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 20px 20px 16px;
    border-radius: var(--card-border-radius);
    background: var(--panel);
    backdrop-filter: blur(24px);
    outline: 1.5px solid var(--helium-elevated-10); outline-offset: -1.5px;
    box-shadow: 4px 8px 30px 0 var(--tooltip-shadow);
    text-align: left;
    opacity: 0; visibility: hidden;
    transform: translateY(8px) scale(0.98);
    transform-origin: bottom left;
    transition: opacity 0.15s, transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s linear 0.2s;
  }
  .wx.end .panel { left: auto; right: 0; transform-origin: bottom right; }
  .wx.open .panel { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }

  .p-head, .p-foot { display: flex; justify-content: space-between; align-items: baseline; }
  .p-head h5:last-child { font-variant-numeric: tabular-nums; }
  .p-foot { margin-top: 12px; }
  .p-foot a, .p-foot p { font-size: 12px; color: var(--tertiary); text-decoration: none; }
  .p-foot a:hover { text-decoration: underline; text-underline-offset: 4px; }

  .hero { display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 12px; margin: 14px 0 18px; }
  .hero-ic { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 16px; background: var(--helium-elevated-10); }
  .hero h1 { font-size: 56px; letter-spacing: -0.04em; }
  .hero-meta { justify-self: end; text-align: right; display: grid; gap: 3px; }
  .hero-meta p { font-size: 14px; }

  /* Stat tiles look like Prism's .button.card */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-1); margin-bottom: 18px; }
  .card { display: flex; align-items: center; gap: var(--gap-3); padding: 12px 14px; border-radius: 14px; background: var(--helium-elevated-7); }
  .card svg { color: var(--secondary); }
  .card p { font-size: 13px; margin-bottom: 3px; }
  .card h4 { font-size: 15px; font-variant-numeric: tabular-nums; }

  .section { color: var(--tertiary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .week { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
  .week li {
    display: grid; grid-template-columns: 52px 26px 48px 28px 1fr 28px; align-items: center; gap: 8px;
    height: 40px; padding: 0 8px; margin: 0 -8px;
    border-radius: 10px;
    font-size: 15px;
    transition: 0.15s background-color;
  }
  .week li:hover { background: var(--helium-elevated-10); }
  .week .ic { display: grid; color: var(--secondary); }
  .week .mm { color: var(--secondary); font-size: 12px; }
  .week .lo { color: var(--tertiary); text-align: right; }
  .week .hi { text-align: right; font-weight: 600; }
  .bar { position: relative; height: 6px; border-radius: 3px; background: var(--helium-elevated-10); }
  .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--bar-start), var(--bar-end)); }
  .bar em {
    position: absolute; top: 50%; width: 10px; height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 0 2.5px var(--bg-surface);
  }

  /* World clocks in the top corners, mirroring the weather pills */
  .clocks {
    position: fixed; left: 5vw; right: 5vw; top: 4vh;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  .wc { display: grid; gap: 6px; }
  .wc.end { margin-left: auto; text-align: right; }
  .wc h6 { color: var(--tertiary); text-transform: uppercase; letter-spacing: 0.06em; }
  .wc-time { font-size: 34px; font-weight: 450; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .wc p { font-size: 14px; }

  /* Bottom centre: the uBlock pill and the settings gear */
  .dock {
    position: fixed; left: 50%; bottom: 4vh; translate: -50% 0;
    display: flex; align-items: flex-end; gap: 8px;
    /* Shown by app.js once the pills have their numbers */
    opacity: 0; visibility: hidden;
    transition: opacity 0.2s, visibility 0s linear 0.2s;
  }
  .dock.ready { opacity: 1; visibility: visible; transition-delay: 0s; }
  /* Centred on the dock rather than the pill, so it stays inside a narrow window */
  .wx.center { position: static; }
  .wx.center .panel { left: 50%; translate: -50% 0; transform-origin: bottom center; }

  /* Privacy report: blocked requests split into trackers, ads and other */
  .p-head:has(.seg) { align-items: center; }
  .seg { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--helium-elevated-7); }
  .seg button {
    padding: 3px 8px;
    border: 0; border-radius: 7px;
    background: none; color: var(--tertiary);
    font: inherit; font-size: 12px; letter-spacing: inherit;
    cursor: pointer;
    transition: 0.15s background-color, 0.15s color;
  }
  .seg button:hover { color: var(--primary); }
  .seg button[aria-pressed="true"] { background: var(--helium-elevated-15); color: var(--primary); }
  .seg button:focus-visible { outline: 2px solid var(--primary); outline-offset: -1px; }
  .k-trackers { background: var(--trackers); }
  .k-ads { background: var(--ads); }
  .k-other { background: var(--other); }

  /* Browsing activity: visits per day (or hour, for today) and the privacy report's parts */
  .chart { position: relative; display: flex; height: 72px; }
  /* Each column is the bar's whole hover area. No transitions: the panel blurs what's
     behind it, and every frame of a fade would redraw that blur. */
  .chart .col { flex: 1; display: flex; align-items: flex-end; height: 100%; padding: 0 2px; }
  .chart .col i { width: 100%; min-height: 2px; border-radius: 3px; background: var(--helium-elevated-15); }
  .chart .col.now i { background: var(--typed); }
  .chart .col.on:not(.now) i { background: var(--secondary); }
  .chart-tip {
    position: absolute; z-index: 1; translate: -50% 0;
    display: flex; align-items: baseline; gap: 4px;
    padding: 5px 9px;
    border-radius: 8px;
    background: var(--tooltip-bg);
    box-shadow: 2px 4px 14px 0 var(--tooltip-shadow);
    font-size: 12px; color: var(--secondary); white-space: nowrap; font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .chart-tip[hidden] { display: none; }
  .chart-tip strong { font-size: 13px; color: var(--primary); }
  .chart-tip span { margin-left: 4px; color: var(--tertiary); }
  .axis { display: flex; justify-content: space-between; margin: 6px 0 16px; font-size: 12px; color: var(--tertiary); font-variant-numeric: tabular-nums; }
  /* Today: a label every three bars, at the left edge of the bar it starts */
  .axis.hours { display: grid; grid-template-columns: repeat(4, 1fr); padding: 0 2px; }
  .section + .split { margin-top: 8px; }
  .legend.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }
  .legend.two strong { margin-left: auto; }
  .k-typed { background: var(--typed); }
  .k-links { background: var(--links); }
  .k-bookmarks { background: var(--bookmarks); }
  .top.sites li { grid-template-columns: 16px minmax(0, 1fr) 96px 52px; }
  .top .fav { display: inline-flex; width: 16px; height: 16px; color: var(--tertiary); }
  .top a.name { color: inherit; text-decoration: none; }
  .top a.name:hover { text-decoration: underline; text-underline-offset: 4px; }
  .split { display: flex; gap: 2px; height: 8px; margin: -4px 0 10px; border-radius: 4px; overflow: hidden; background: var(--helium-elevated-10); }
  .split i { min-width: 3px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 18px; padding: 0; list-style: none; font-size: 13px; color: var(--secondary); }
  .legend li { display: flex; align-items: center; gap: 6px; }
  .legend strong { color: var(--primary); font-variant-numeric: tabular-nums; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  .top { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
  .top li {
    display: grid; grid-template-columns: 8px minmax(0, 1fr) 96px 52px; align-items: center; gap: 10px;
    height: 34px; padding: 0 8px; margin: 0 -8px;
    border-radius: 10px;
    font-size: 15px;
    transition: 0.15s background-color;
  }
  .top li:hover { background: var(--helium-elevated-10); }
  .top li.muted { display: block; line-height: 34px; }
  .top .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .n { text-align: right; color: var(--secondary); }

  /* Settings: the gear, and the dialog it opens */
  .settings-btn {
    justify-content: center; width: 38px; padding: 0;
    color: var(--secondary);
    opacity: 0.6;
  }
  .settings-btn:hover, .settings-btn:focus-visible { opacity: 1; }

  .settings {
    width: min(440px, calc(100vw - 32px));
    padding: 20px 20px 16px;
    border: 0;
    border-radius: var(--card-border-radius);
    background: var(--panel);
    backdrop-filter: blur(24px);
    outline: 1.5px solid var(--helium-elevated-10); outline-offset: -1.5px;
    box-shadow: 4px 8px 30px 0 var(--tooltip-shadow);
    color: var(--primary);
    text-align: left;
    /* The city results hang below their field */
    overflow: visible;
  }
  /* Same motion as the weather panels, both ways. allow-discrete keeps the dialog
     shown (display, top layer) until it has faded out. */
  .settings, .settings::backdrop {
    transition: opacity 0.15s, transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1),
      display 0.2s allow-discrete, overlay 0.2s allow-discrete;
  }
  .settings { opacity: 0; transform: translateY(8px) scale(0.98); }
  .settings[open] { opacity: 1; transform: none; }
  .settings::backdrop { background: color-mix(in srgb, var(--bg-surface) 25%, transparent); opacity: 0; }
  .settings[open]::backdrop { opacity: 1; }
  @starting-style {
    .settings[open] { opacity: 0; transform: translateY(8px) scale(0.98); }
    .settings[open]::backdrop { opacity: 0; }
  }
  .s-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .settings .hint { font-size: 13px; color: var(--tertiary); margin-bottom: 10px; }
  .settings kbd { font: inherit; padding: 1px 5px; border-radius: 5px; background: var(--helium-elevated-10); }

  .icon-btn {
    display: grid; place-items: center;
    width: 30px; height: 30px; padding: 0;
    border: 0; border-radius: 8px;
    background: none; color: var(--tertiary);
    cursor: pointer;
    transition: 0.15s background-color;
  }
  .icon-btn:hover { background: var(--helium-elevated-10); color: var(--primary); }
  .icon-btn:focus-visible { outline: 2px solid var(--primary); }
  .icon-btn[hidden] { display: none; }

  /* Search engine, time format and temperature: a label and its control per row */
  .prefs { display: grid; grid-template-columns: auto auto; justify-content: space-between; align-items: center; gap: 10px 16px; margin-bottom: 20px; }
  .prefs > label, .prefs > span { font-size: 14px; color: var(--secondary); }
  .prefs .seg { justify-self: end; }
  .prefs .seg button { padding: 4px 10px; font-size: 13px; }
  .input-field.select { position: relative; width: auto; min-height: 0; margin-top: 0; padding: 0; background: var(--helium-elevated-7); cursor: pointer; }
  .input-field.select select {
    appearance: none;
    padding: 5px 30px 5px 10px;
    border: 0; outline: 0; background: none;
    color: inherit; font: inherit; font-size: 13px; letter-spacing: inherit;
    cursor: pointer;
  }
  .input-field.select select option { background: var(--bg-surface); color: var(--primary); }
  .input-field.select svg { position: absolute; right: 8px; color: var(--tertiary); pointer-events: none; }
  .slots { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap-1); margin-bottom: 20px; }
  .slot { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: center; gap: 8px; }
  .slot > span { font-size: 13px; color: var(--tertiary); }
  .slot .input-field { width: 100%; min-height: 42px; margin-top: 0; padding: 6px 6px 6px 12px; background: var(--helium-elevated-7); }
  .slot .country { font-size: 13px; color: var(--tertiary); white-space: nowrap; }
  .slot .input-field:focus-within .country { display: none; }
  .results {
    position: absolute; z-index: 1; left: 52px; right: 0; top: calc(100% + 4px);
    margin: 0; padding: 4px;
    list-style: none;
    border-radius: var(--mid-border-radius);
    background: var(--bg-surface);
    outline: 1.5px solid var(--helium-elevated-10); outline-offset: -1.5px;
    box-shadow: 4px 8px 30px 0 var(--tooltip-shadow);
  }
  .results:empty { display: none; }
  .results li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 10px; border-radius: 8px; font-size: 15px; cursor: pointer; }
  .results li small { font-size: 13px; color: var(--tertiary); text-align: right; }
  .results li.active { background: var(--helium-elevated-10); }
  .results li.note { color: var(--tertiary); cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    #shimmer, .panel, .dock { transition-duration: 1ms; }
    .settings, .settings::backdrop { transition-duration: 1ms; }
  }
</style>
</head>
<body>
<canvas id="shimmer" aria-hidden="true"></canvas>

<main class="app">
  <div class="time" id="time"></div>
  <div class="date" id="date"></div>

  <form class="input-field" id="search" role="search">
    <span class="accessory" id="search-icon"></span>
    <input id="q" type="search" placeholder="Search or type a !bang" aria-label="Search" autocomplete="off" spellcheck="false"
      role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
    <span class="bang-chip" id="bang-chip"></span>
    <ul class="suggest" id="suggest" role="listbox" aria-label="Suggestions"></ul>
  </form>
</main>

<section class="clocks" id="clocks" aria-label="World clock"></section>
<section class="weather" id="weather"></section>
<div class="dock">
  <div class="wx center" id="activity" hidden></div>
  <div class="wx center" id="ublock" hidden></div>
  <button class="button settings-btn" id="settings-open" type="button" aria-label="Settings"></button>
</div>

<dialog class="settings" id="settings" aria-labelledby="settings-title">
  <div class="s-head">
    <h4 id="settings-title">Settings</h4>
    <button class="icon-btn" id="settings-close" type="button" aria-label="Close"></button>
  </div>
  <h6 class="section">General</h6>
  <div class="prefs">
    <label for="engine">Search engine</label>
    <div class="input-field select" id="engine-field"><select id="engine"></select></div>
    <span id="hour12-label">Time format</span>
    <div class="seg" role="group" aria-labelledby="hour12-label" data-setting="hour12">
      <button type="button" data-value="false">24-hour</button><button type="button" data-value="true">12-hour</button>
    </div>
    <span id="fahrenheit-label">Temperature</span>
    <div class="seg" role="group" aria-labelledby="fahrenheit-label" data-setting="fahrenheit">
      <button type="button" data-value="false">°C</button><button type="button" data-value="true">°F</button>
    </div>
  </div>
  <h6 class="section">Weather</h6>
  <p class="hint">Shown in the bottom corners. Leave a slot empty to hide it.</p>
  <div class="slots" data-kind="weather"></div>
  <h6 class="section">World clock</h6>
  <p class="hint">Time and date in the top corners. Leave a slot empty to hide it.</p>
  <div class="slots" data-kind="clocks"></div>
  <div class="p-foot"><a href="https://open-meteo.com/">City search by Open-Meteo</a><p><kbd id="shortcut"></kbd> opens and closes this</p></div>
</dialog>

<script src="shimmer.js"></script>
<script src="app.js"></script>
</body>
</html>
